name: Build RebirthDimension

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RebirthDimension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: RebirthDimension/pom.xml

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RebirthDimension
          path: RebirthDimension/target/RebirthDimension.jar
          if-no-files-found: error
